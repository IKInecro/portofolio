<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — IKI MARCO</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Oswald:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>body{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="bg-[#fafafa] text-gray-900 antialiased">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html#organization" class="font-mono text-sm font-bold tracking-widest">← BACK TO HOME</a>
      <span class="font-mono text-xs text-gray-500">GALLERY &bull; 158 PHOTOS</span>
      <a href="index.html" class="neo-btn bg-white px-3 py-1 font-mono text-xs font-bold">HOME</a>
    </div>
  </header>
  <section class="max-w-6xl mx-auto px-4 py-8 md:py-12">
    <div class="text-center mb-8">
      <h1 class="font-oswald text-4xl md:text-5xl font-bold uppercase">Gallery Activities</h1>
      <p class="font-mono text-sm text-gray-500 mt-2">Semua foto kegiatan &bull; 158</p>
    </div>
    <div id="galleryGridAll" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- 158 items injected via JS for performance -->
    </div>
    <div class="flex justify-center mt-6">
      <button type="button" id="galleryLoadMore" class="bg-white border border-gray-200 text-gray-700 font-mono text-xs font-bold px-6 py-2.5 rounded-full shadow-sm hover:bg-gray-50">LAGI? — Load 24 more</button>
    </div>
  </section>
  <div id="posterModal" class="modal fixed inset-0 bg-black/90 z-50 items-center justify-center p-4" onclick="closeModal()">
    <div class="relative max-w-4xl max-h-[90vh]" onclick="event.stopPropagation()">
      <button type="button" class="absolute -top-10 right-0 text-white font-mono text-sm hover:text-gray-300">CLOSE [×]</button>
      <img id="modalImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Preview" class="max-w-full max-h-[85vh] object-contain">
      <p id="modalCaption" class="text-white text-center font-mono mt-4"></p>
    </div>
  </div>
  <script>
    function openModal(src,title){document.getElementById('modalImage').src=src;document.getElementById('modalCaption').textContent=title;document.getElementById('posterModal').classList.add('active');document.body.style.overflow='hidden'}
    function closeModal(){document.getElementById('posterModal').classList.remove('active');document.body.style.overflow=''}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    const grid=document.getElementById('galleryGridAll');
    const btn=document.getElementById('galleryLoadMore');
    const total=158; let shown=0; const batch=24;
    function addBatch(){
      const next=Math.min(shown+batch,total);
      for(let i=shown+1;i<=next;i++){
        const div=document.createElement('div');
        div.className='gallery-grid-item group relative rounded-xl overflow-hidden border border-gray-200 bg-gray-100 aspect-[4/3] cursor-pointer';
        div.setAttribute('onclick',`openModal('assets/gallery_act/${i}.webp','Gallery ${i}')`);
        div.innerHTML=`<img src="assets/gallery_act/${i}.webp" alt="Gallery ${i}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy"><div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div><span class="absolute bottom-2 left-2 right-2 text-white font-mono text-[11px] truncate opacity-0 group-hover:opacity-100 transition-opacity">Gallery ${i}</span>`;
        grid.appendChild(div);
      }
      shown=next;
      if(shown>=total) btn.style.display='none';
    }
    addBatch();
    btn.addEventListener('click',addBatch);
  </script>
</body>
</html>
